<!DOCTYPE html>
<html lang="en" data-mode="light" data-accent="default" data-theme="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f2f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TeachAssist" />
    <title>TeachAssist</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <link rel="stylesheet" href="css/student-tools.css" />
    <link rel="stylesheet" href="css/refresh.css" />
    <link rel="stylesheet" href="css/v5.css" />
    <link rel="stylesheet" href="css/v6.css" />
    <link rel="stylesheet" href="css/v7.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/glass.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <link rel="stylesheet" href="css/liquid.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Each "screen" is rendered into by a JS module. Only one is visible. -->
      <main id="screen-courses" class="screen">
        <div class="center-loader"><span class="spinner"></span></div>
      </main>
      <main id="screen-profile" class="screen hidden"></main>
      <main id="screen-detail" class="screen hidden"></main>
      <main id="screen-guidance" class="screen hidden"></main>
      <main id="screen-dreams" class="screen hidden"></main>
      <main id="screen-settings" class="screen hidden"></main>

      <nav class="tabbar" id="tabbar">
        <button data-tab="courses" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z" />
            <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5A1.5 1.5 0 0 1 20 20.5z" />
          </svg>
          Courses
        </button>
        <button data-tab="guidance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3" />
            <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
            <path d="M16 4.5a3 3 0 0 1 0 6M20.5 20a5.5 5.5 0 0 0-4-5.3" />
          </svg>
          Guidance
        </button>
        <button data-tab="dreams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg>Dreams</button>
        <button data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
          Settings
        </button>
      </nav>
    </div>

    <aside id="notice" class="app-notice hidden" role="status"><div><b></b><p></p></div><button aria-label="Dismiss notification">×</button></aside>
    <div id="modal-root"></div>

    <script type="module" src="js/app-main.js"></script>
  </body>
</html>
